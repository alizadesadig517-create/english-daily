name: Build APK

on:
  push:
    branches: [main, ccr-0bf78db1-z8mzi4]
    # Daily lessons and learner settings don't need a new app build.
    paths-ignore:
      - 'content/**'
      - 'config/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate lesson content
        working-directory: .
        run: python3 scripts/validate.py

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning title=Unsigned build::Signing secrets are missing, so this APK is signed with a temporary DEBUG key. It cannot be installed over an earlier APK - see README 'Signing key'."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Remove signing files
        if: always()
        run: rm -f android/release.jks android/key.properties

      # The GitHub Release below is the main download. The artifact is a
      # convenience copy, so a full artifact storage quota must not fail the build.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 7
          name: english-daily-v${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: English Daily v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Build ${{ github.run_number }} from ${{ github.sha }}.
            Signed with release key: ${{ env.SIGNED }}

            On your phone: tap **app-release.apk** below, then open it to install.
          files: app/build/app/outputs/flutter-apk/app-release.apk
