<title>English Daily</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one-screen game. Home = header chips, today's episode, quests, winding path.
   Lesson = sticky progress bar, stage, bottom sheet for feedback. Story = lines revealed one by one. */
:root {
  --bg: #f3f7f4; --surface: #ffffff; --sunk: #e9f0ec; --fg: #17241f; --muted: #5c726a; --line: #d6e2dc;
  --primary: #1fae7a; --primary-dark: #128058; --primary-soft: #dcf5ea;
  --gold: #ffb020; --gold-dark: #d48806; --gold-soft: #fff1d6;
  --danger: #ea4d4d; --danger-dark: #b73333; --danger-soft: #fde3e3;
  --info: #2f80ed; --info-dark: #1d5bb5; --info-soft: #e1ecff;
  --plum: #8b5cf6; --plum-soft: #eee7ff;
  --display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1915; --surface: #172520; --sunk: #12201b; --fg: #e8f2ed; --muted: #97ada5; --line: #2a3c35;
  --primary: #2fc88f; --primary-dark: #1a8c62; --primary-soft: #183a2d;
  --gold: #ffbd45; --gold-dark: #c98a12; --gold-soft: #3b2e14;
  --danger: #f26b6b; --danger-dark: #b84545; --danger-soft: #3d2121;
  --info: #5b9dff; --info-dark: #2f6bc4; --info-soft: #1c2c47;
  --plum: #a989ff; --plum-soft: #2a2244;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1915; --surface: #172520; --sunk: #12201b; --fg: #e8f2ed; --muted: #97ada5; --line: #2a3c35;
  --primary: #2fc88f; --primary-dark: #1a8c62; --primary-soft: #183a2d;
  --gold: #ffbd45; --gold-dark: #c98a12; --gold-soft: #3b2e14;
  --danger: #f26b6b; --danger-dark: #b84545; --danger-soft: #3d2121;
  --info: #5b9dff; --info-dark: #2f6bc4; --info-soft: #1c2c47;
  --plum: #a989ff; --plum-soft: #2a2244;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 620px; margin: 0 auto; position: relative; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; font-family: var(--display); line-height: 1.1; text-wrap: balance; }
.eyebrow { font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; }
.wrap { flex-wrap: wrap; }

/* 3D buttons */
.btn { display: block; width: 100%; border: 0; border-radius: 16px; padding: 14px 18px; font-family: var(--body); font-weight: 900; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; background: var(--primary); color: #fff; box-shadow: 0 5px 0 var(--primary-dark); transition: transform .06s, box-shadow .06s; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-dark); }
.btn:disabled { background: var(--sunk); color: var(--muted); box-shadow: 0 5px 0 var(--line); cursor: default; }
.btn.red { background: var(--danger); box-shadow: 0 5px 0 var(--danger-dark); }
.btn.gold { background: var(--gold); color: #3a2600; box-shadow: 0 5px 0 var(--gold-dark); }
.btn.blue { background: var(--info); box-shadow: 0 5px 0 var(--info-dark); }
.btn.ghost { background: var(--surface); color: var(--info); box-shadow: 0 5px 0 var(--line); border: 2px solid var(--line); }

/* ---------- HOME ---------- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding-block: 10px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; font-size: 16px; padding: 6px 10px; border-radius: 12px; font-variant-numeric: tabular-nums; }
.chip.fire { color: var(--gold-dark); }
.chip.fire.cold { color: var(--muted); filter: grayscale(1); }
.chip.xp { color: var(--info); }
.chip.heart { color: var(--danger); }
.hdr .title { flex: 1; min-width: 0; }
.hdr .title h1 { font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scroll { flex: 1; overflow-y: auto; padding-block: 16px 40px; }
.hero { position: relative; border-radius: 22px; padding: 18px; color: #fff; background: linear-gradient(160deg, #1d8f69 0%, #146e57 55%, #0f5a4a 100%); overflow: hidden; box-shadow: 0 6px 0 #0b4538; }
.hero .eyebrow { color: rgba(255,255,255,.8); }
.hero h2 { font-size: 26px; margin: 6px 0 4px; }
.hero p { margin: 0; color: rgba(255,255,255,.9); font-weight: 700; font-size: 15px; max-width: 34ch; }
.hero .cast { display: flex; margin-top: 14px; }
.hero .cast .av { margin-right: -10px; border: 3px solid #146e57; border-radius: 50%; background: #146e57; }
.hero .win { position: absolute; right: -18px; top: -10px; width: 150px; opacity: .18; }
.hero .fb { margin-top: 12px; background: rgba(255,255,255,.14); border-radius: 14px; padding: 10px 12px; font-size: 14px; font-weight: 700; }
.week { display: flex; justify-content: space-between; gap: 4px; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 10px 12px; }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 900; color: var(--muted); flex: 1; }
.week .d i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; background: var(--sunk); font-size: 15px; }
.week .d.on i { background: var(--gold); box-shadow: 0 3px 0 var(--gold-dark); }
.week .d.today b { color: var(--fg); }
.quests { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.quest { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; }
.quest .qi { font-size: 24px; text-align: center; }
.quest .qt { font-weight: 800; font-size: 15px; }
.qbar { height: 12px; background: var(--sunk); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.qbar i { display: block; height: 100%; background: var(--gold); border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.quest.done .qbar i { background: var(--primary); }
.quest .qn { font-weight: 900; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.path { position: relative; display: flex; flex-direction: column; align-items: center; gap: 30px; padding-block: 24px 10px; }
.unit { width: 100%; margin-bottom: 30px; border-radius: 18px; padding: 14px 16px; background: var(--primary); color: #fff; box-shadow: 0 5px 0 var(--primary-dark); }
.unit .eyebrow { color: rgba(255,255,255,.85); }
.unit h3 { font-size: 20px; margin-top: 2px; }
.pn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pbtn { width: 78px; height: 72px; border-radius: 50%; border: 0; background: var(--primary); box-shadow: 0 8px 0 var(--primary-dark); font-size: 30px; display: grid; place-items: center; transition: transform .08s, box-shadow .08s; }
.pbtn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 var(--primary-dark); }
.pn.done .pbtn { background: var(--gold); box-shadow: 0 8px 0 var(--gold-dark); }
.pn.locked .pbtn { background: var(--sunk); box-shadow: 0 8px 0 var(--line); filter: grayscale(1); cursor: default; }
.pn.cur .ring { position: absolute; top: -9px; width: 96px; height: 96px; border-radius: 50%; border: 6px solid var(--primary-soft); pointer-events: none; }
.pn .lbl { font-weight: 900; font-size: 15px; text-align: center; max-width: 180px; }
.pn .sub { font-size: 12px; font-weight: 800; color: var(--muted); margin-top: -4px; text-align: center; max-width: 180px; }
.pn.locked .lbl { color: var(--muted); }
.start { position: absolute; top: -48px; background: var(--surface); color: var(--primary-dark); border: 2px solid var(--line); border-radius: 12px; padding: 4px 12px; font-weight: 900; font-size: 14px; letter-spacing: .06em; animation: bob 1.4s ease-in-out infinite; white-space: nowrap; }
.start::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
@keyframes bob { 50% { transform: translateY(-5px); } }
.mascot { display: flex; align-items: flex-end; gap: 10px; }
.mascot .msay { position: relative; flex: 1; min-width: 0; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; font-weight: 800; font-size: 16px; line-height: 1.35; }
.mascot .msay::after { content: ""; position: absolute; left: -8px; bottom: 18px; width: 12px; height: 12px; background: var(--surface); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.status { font-size: 13px; color: var(--muted); font-weight: 700; text-align: center; }

/* ---------- LESSON ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; padding-block: 12px; background: var(--bg); }
.x { background: none; border: 0; padding: 4px; color: var(--muted); font-size: 24px; line-height: 1; border-radius: 10px; }
.bar { flex: 1; height: 16px; background: var(--sunk); border-radius: 999px; overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 999px; transition: width .4s cubic-bezier(.2,.8,.2,1); position: relative; }
.bar > i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.4); }
.bar.hot > i { background: linear-gradient(90deg, var(--gold), #ff7a3d); }
.combo { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.stage { flex: 1; overflow-y: auto; padding-block: 8px 24px; }
.coach { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 18px; }
.coach .bub { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; font-weight: 800; font-size: 18px; flex: 1; min-width: 0; }
.coach .bub::before { content: ""; position: absolute; left: -8px; bottom: 14px; width: 12px; height: 12px; background: var(--surface); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.coach .bub .hint { display: block; font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 4px; }
.qtype { font-family: var(--display); font-size: 24px; font-weight: 800; margin-bottom: 14px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 13px 14px; font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 var(--line); display: flex; gap: 12px; align-items: center; transition: transform .06s, box-shadow .06s; }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt .k { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; color: var(--muted); flex: none; }
.opt.sel { border-color: var(--info); background: var(--info-soft); box-shadow: 0 4px 0 var(--info); color: var(--info-dark); }
.opt.right { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 4px 0 var(--primary); color: var(--primary-dark); }
.opt.wrong { border-color: var(--danger); background: var(--danger-soft); box-shadow: 0 4px 0 var(--danger); color: var(--danger-dark); }
.opt:disabled { cursor: default; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 .opt { justify-content: center; text-align: center; min-height: 62px; padding: 10px; }
.opt.gone { opacity: 0; pointer-events: none; transform: scale(.9); transition: opacity .3s, transform .3s; }
.say { width: 64px; height: 64px; border-radius: 18px; border: 0; background: var(--info); color: #fff; font-size: 28px; box-shadow: 0 5px 0 var(--info-dark); flex: none; }
.say.sm { width: 40px; height: 40px; font-size: 18px; border-radius: 12px; box-shadow: 0 3px 0 var(--info-dark); }
.say.slow { background: var(--surface); color: var(--info); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.say:active { transform: translateY(3px); box-shadow: none; }
.answerline { min-height: 64px; border-bottom: 2px solid var(--line); background: repeating-linear-gradient(transparent 0 58px, var(--line) 58px 60px); display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 10px; margin-bottom: 20px; align-content: flex-start; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; font-weight: 800; box-shadow: 0 4px 0 var(--line); font-size: 17px; animation: tileIn .18s ease-out; }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.tile.used { background: var(--sunk); color: transparent; box-shadow: none; border-color: var(--sunk); pointer-events: none; animation: none; }
@keyframes tileIn { from { transform: scale(.85); opacity: 0; } }
.in { width: 100%; font: inherit; font-weight: 800; font-size: 18px; padding: 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--sunk); color: var(--fg); }
textarea.in { min-height: 130px; resize: vertical; font-weight: 700; line-height: 1.5; }
/* flip card */
.flip { perspective: 1200px; cursor: pointer; }
.flip .inner { display: grid; transition: transform .5s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
.flip.on .inner { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 22px 18px; box-shadow: 0 6px 0 var(--line); }
.face.back { transform: rotateY(180deg); }
.face.front { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; min-height: 280px; }
.face .w { font-family: var(--display); font-size: 44px; font-weight: 800; line-height: 1; }
.face .ipa { color: var(--muted); font-weight: 700; }
.face .tap { font-size: 13px; font-weight: 900; color: var(--info); letter-spacing: .08em; text-transform: uppercase; }
.pos { display: inline-block; font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; background: var(--plum-soft); color: var(--plum); border-radius: 999px; padding: 3px 10px; }
.tr { font-family: var(--display); font-size: 24px; font-weight: 800; color: var(--primary-dark); line-height: 1.15; margin: 6px 0 2px; }
.def { margin: 4px 0 0; font-weight: 700; color: var(--muted); font-size: 15px; }
.ex { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: var(--sunk); display: flex; gap: 10px; align-items: flex-start; }
.ex b { display: block; font-weight: 800; }
.ex i { display: block; color: var(--muted); font-style: normal; font-weight: 700; font-size: 14px; }
.rule { padding: 10px 12px; border-left: 5px solid var(--plum); background: var(--sunk); border-radius: 0 14px 14px 0; }
.rule b { font-weight: 800; }
.rule i { display: block; color: var(--muted); font-style: normal; font-weight: 700; font-size: 14px; margin-top: 2px; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px; }

/* feedback sheet */
.foot { padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 2px solid var(--line); background: var(--bg); transition: background .2s; }
.foot.ok { background: var(--primary-soft); border-color: transparent; }
.foot.bad { background: var(--danger-soft); border-color: transparent; }
.fbk { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; animation: up .25s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(16px); opacity: 0; } }
.fbk .badge { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; flex: none; background: var(--surface); }
.fbk h3 { font-size: 22px; }
.foot.ok .fbk h3 { color: var(--primary-dark); }
.foot.bad .fbk h3 { color: var(--danger-dark); }
.fbk p { margin: 2px 0 0; font-weight: 700; font-size: 15px; }
.foot.bad .fbk .ans { font-weight: 900; color: var(--danger-dark); }

/* story player */
.lines { display: flex; flex-direction: column; gap: 14px; }
.ln { animation: up .3s cubic-bezier(.2,.8,.2,1); }
.ln.narr { font-size: 18px; line-height: 1.6; font-weight: 600; }
.ln.talk { display: flex; gap: 10px; align-items: flex-start; }
.ln.talk .who { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.ln.talk .bub { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; font-size: 18px; line-height: 1.5; font-weight: 700; }
.ln .tl { display: block; font-size: 14px; color: var(--muted); font-weight: 700; margin-top: 4px; }
.ln .tg { border: 0; background: none; color: var(--info); font-size: 12px; font-weight: 900; padding: 0 4px; vertical-align: 2px; }
.g { border-bottom: 2px dotted var(--info); cursor: pointer; }
.g.nw { color: var(--primary-dark); border-bottom-color: var(--primary); font-weight: 800; }
.ln.old { opacity: .55; }
.qcard { background: var(--plum-soft); border: 2px solid var(--plum); border-radius: 18px; padding: 14px; animation: up .3s cubic-bezier(.2,.8,.2,1); }
.qcard .eyebrow { color: var(--plum); }
.qcard .q { font-weight: 900; font-size: 18px; margin: 4px 0 10px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-radius: 22px 22px 0 0; border-top: 2px solid var(--line); padding-block: 18px calc(22px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 30px rgba(0,0,0,.18); max-width: 620px; margin: 0 auto; animation: up .25s cubic-bezier(.2,.8,.2,1); }
.sheet .w { font-family: var(--display); font-size: 28px; font-weight: 800; }
.scrim { position: fixed; inset: 0; z-index: 19; background: rgba(0,0,0,.3); }

/* result */
.result { text-align: center; padding-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.result h1 { font-size: 32px; color: var(--gold-dark); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-top: 8px; }
.tile3 { border-radius: 16px; border: 2px solid var(--gold); overflow: hidden; background: var(--surface); }
.tile3 .h { background: var(--gold); color: #3a2600; font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; padding: 4px; }
.tile3 b { display: block; font-family: var(--display); font-size: 26px; padding: 8px 4px; font-variant-numeric: tabular-nums; }
.tile3.g { border-color: var(--primary); } .tile3.g .h { background: var(--primary); color: #fff; } .tile3.g b { color: var(--primary-dark); }
.tile3.b { border-color: var(--info); } .tile3.b .h { background: var(--info); color: #fff; } .tile3.b b { color: var(--info); }

.toast { position: fixed; z-index: 40; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: calc(64px + env(safe-area-inset-top, 0px)); max-width: 588px; margin: 0 auto; background: var(--fg); color: var(--bg); border-radius: 16px; padding: 12px 14px; font-weight: 800; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: up .25s; }
.burst { position: fixed; z-index: 35; pointer-events: none; white-space: nowrap; font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--gold-dark); text-shadow: 0 2px 0 var(--surface); animation: burst 1s ease-out forwards; }
@keyframes burst { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0; } 20% { transform: translate(-50%, -10px) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -60px) scale(1); opacity: 0; } }
#fx { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.pop { animation: pop .35s; }
@keyframes pop { 40% { transform: scale(1.12); } }
.av { display: block; flex: none; }
.hearts-pop { animation: pop .35s; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
(function () {
  const D = window.DATA;

  function bindCommon() {

        if (A === null || B === null) return;
        const a = app.querySelector(`[data-side="a"][data-i="${A}"]`), b = app.querySelector(`[data-side="b"][data-i="${B}"]`);
        if (A === B) { a.classList.add('right'); b.classList.add('right'); sOk(); matched++; setTimeout(() => { a.classList.add('gone'); b.classList.add('gone'); }, 300); if (matched === e.pairs.length) { S.asked++; if (!miss) { S.ok++; bumpCombo(go); } S.earned += 10; go.disabled = false; burst('+10', go); } }
        else { a.classList.add('wrong'); b.classList.add('wrong'); sBad(); miss++; loseHeart(); setTimeout(() => { a.classList.remove('wrong', 'sel'); b.classList.remove('wrong', 'sel'); }, 450); }
        a.classList.remove('sel'); b.classList.remove('sel'); A = B = null;

        if (side === 'a') { A = +btn.dataset.i; speak(btn.textContent.trim()); } else B = +btn.dataset.i;

  function bumpCombo(anchor) {

  const PRAISE = ['Əla!', 'Super!', 'Düzdür!', 'Möhtəşəm!', 'Belə davam!', 'Bravo!'];

  function next() { if (S.screen !== 'ex') return; S.i++; renderEx(); }

  // ---------- STORY PLAYER ----------
  function storyLines() {
    const sp = D.extras.speakers || {}, comp = D.extras.comprehension || [], P = D.lesson.story.paragraphs.length;
    const out = [];
    D.lesson.story.paragraphs.forEach((p, pi) => {
      p.sentences.forEach((s, si) => out.push({ kind: 'line', text: s.text, tr: s.translation, who: sp[pi + '-' + si] || 'Narrator' }));
      comp.forEach((c, k) => { const at = c.after != null ? c.after : Math.min(P - 1, Math.round((k + 1) * P / (comp.length + 1)) - 1); if (at === pi) out.push({ kind: 'q', q: c }); });
    });
    return out;
  }
  function markup(text) {
    const gl = D.lesson.story.glossary.slice().sort((a, b) => b.term.length - a.term.length);
    const newLemmas = new Set(W.map(w => w.word.toLowerCase()));
    const lower = text.toLowerCase(), marks = [];
    gl.forEach(g => { const t = g.term.toLowerCase(); let from = 0; for (;;) { const k = lower.indexOf(t, from); if (k < 0) break; const b = k === 0 ? ' ' : lower[k - 1], a = lower[k + t.length] || ' '; if (!/[\p{L}\p{N}]/u.test(b) && !/[\p{L}\p{N}]/u.test(a) && !marks.some(m => k < m.end && k + t.length > m.start)) marks.push({ start: k, end: k + t.length, g }); from = k + t.length; } });
    marks.sort((a, b) => a.start - b.start);
    let i = 0, html = '';
    marks.forEach(m => { html += esc(text.slice(i, m.start)) + `<span class="g ${newLemmas.has(m.g.lemma.toLowerCase()) ? 'nw' : ''}" data-g="${esc(m.g.term)}">${esc(text.slice(m.start, m.end))}</span>`; i = m.end; });
    return html + esc(text.slice(i));
  }
  function renderStory() {
    const L = storyLines(); let shown = 0, waitingQ = false;
    const st = D.lesson.story;
    app.innerHTML = topBar() + `<div class="stage pad" id="stage"><div class="qtype" style="margin-bottom:4px">${esc(st.title)}</div><div class="muted" style="font-weight:800;margin-bottom:16px">${esc(st.titleTranslation)} · sözə toxun = tərcümə</div><div class="lines" id="lines"></div></div><div class="foot pad" id="foot"><button class="btn" id="go">Başla</button></div>`;
    bindCommon();
    const box = document.getElementById('lines'), go = document.getElementById('go'), stage = document.getElementById('stage'), barI = app.querySelector('.bar > i');
    const lineHtml = (l, n) => l.who === 'Narrator'
      ? `<div class="ln narr" data-n="${n}">${markup(l.text)} <button class="tg" data-t="${n}">az</button><span class="tl" id="tl${n}" hidden>${esc(l.tr)}</span></div>`
      : `<div class="ln talk" data-n="${n}">${avatar(l.who, /\?/.test(l.text) ? 'wow' : 'neutral', 46)}<div style="min-width:0"><div class="who">${esc(l.who)}</div><div class="bub">${markup(l.text)} <button class="tg" data-t="${n}">az</button><span class="tl" id="tl${n}" hidden>${esc(l.tr)}</span></div></div></div>`;
    function wire(el) {
      el.querySelectorAll('[data-g]').forEach(s => s.addEventListener('click', () => { const g = st.glossary.find(x => x.term === s.dataset.g); if (g) showSheet(g); }));
      el.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => { const t = document.getElementById('tl' + b.dataset.t); t.hidden = !t.hidden; }));
    }
    function reveal() {
      if (waitingQ) return;
      if (shown >= L.length) { S.earned += 20; next(); return; }
      box.querySelectorAll('.ln').forEach(x => x.classList.add('old'));
      const l = L[shown], n = shown; shown++;
      barI.style.width = Math.round(100 * shown / L.length) + '%';
      if (l.kind === 'line') {
        box.insertAdjacentHTML('beforeend', lineHtml(l, n)); wire(box.lastElementChild);
        speak(l.text); go.textContent = shown >= L.length ? 'Hekayəni bitir' : 'Davam';
      } else {
        waitingQ = true; go.disabled = true; go.textContent = 'Cavabla';
        const c = l.q, opts = shuffle(c.options);
        box.insertAdjacentHTML('beforeend', `<div class="qcard" id="qc${n}"><div class="eyebrow">Sual</div><div class="q">${esc(c.question)}</div><div class="opts">${opts.map(o => `<button class="opt" data-qo="${esc(o)}"><span>${esc(o)}</span></button>`).join('')}</div></div>`);
        const card = document.getElementById('qc' + n); let tries = 0;
        card.querySelectorAll('[data-qo]').forEach(b => b.addEventListener('click', () => {
          if (!waitingQ || b.disabled) return;
          if (b.dataset.qo === c.answer) {
            b.classList.add('right'); sOk(); if (!tries) { S.ok++; S.earned += 10; bumpCombo(b); burst('+10', b); } S.asked++;
            card.querySelectorAll('[data-qo]').forEach(x => x.disabled = true);
            if (c.explanation) card.insertAdjacentHTML('beforeend', `<p class="muted" style="margin:10px 0 0;font-weight:700">${esc(c.explanation)}</p>`);
            waitingQ = false; go.disabled = false; go.textContent = shown >= L.length ? 'Hekayəni bitir' : 'Davam';
          } else { tries++; b.classList.add('wrong'); b.disabled = true; sBad(); loseHeart(); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
        }));
      }
      requestAnimationFrame(() => stage.scrollTo({ top: stage.scrollHeight, behavior: reduced ? 'auto' : 'smooth' }));
    }
    go.addEventListener('click', reveal);
  }
  function showSheet(g) {
    closeSheet();
    app.insertAdjacentHTML('beforeend', `<div class="scrim" id="scrim"></div><div class="sheet pad" id="sheet"><div class="row wrap"><div class="w">${esc(g.term)}</div>${sayBtn(g.term)}<span class="pos">${esc(g.partOfSpeech)}</span></div>${g.lemma.toLowerCase() !== g.term.toLowerCase() ? `<div class="muted" style="font-weight:800">${esc(g.lemma)}</div>` : ''}<div class="tr">${esc(g.translation)}</div><p class="def">${esc(g.meaning)}</p></div>`);
    document.getElementById('scrim').addEventListener('click', closeSheet);
    document.querySelector('#sheet [data-say]').addEventListener('click', () => speak(g.term));
    speak(g.term);
  }
  function closeSheet() { ['sheet', 'scrim'].forEach(id => { const el = document.getElementById(id); if (el) el.remove(); }); }

  // ---------- RESULT ----------
  function renderResult() {
    if (S.screen !== 'ex') return;
    S.screen = 'result';
    const node = nodes.find(n => n.id === S.node);
    const first = !S.day.completed.includes(S.node);
    const acc = S.asked ? Math.round(100 * S.ok / S.asked) : 100;
    const secs = Math.round((Date.now() - S.startedAt) / 1000);
    const perfect = S.asked > 0 && S.ok === S.asked;
    let bonus = 0; if (first && perfect) bonus += 20;
    const gained = first ? S.earned + bonus : Math.round(S.earned / 2);
    if (first) S.day.completed.push(S.node);
    if (perfect) S.day.perfect = (S.day.perfect || 0) + 1;
    S.day.xp += gained; S.day.correct += S.ok; S.day.total += S.asked; S.progress.xp += gained;
    S.progress.history = S.progress.history || {}; S.progress.history[D.date] = (S.progress.history[D.date] || 0) + gained;
    let streakUp = false;
    if (S.progress.lastDate !== D.date) { S.progress.streak = S.progress.lastDate === yesterday ? S.progress.streak + 1 : 1; S.progress.lastDate = D.date; S.progress.days = (S.progress.days || 0) + 1; streakUp = true; }
    persist(); sWin(); confetti(perfect ? 180 : 110);
    const allDone = nodes.every(n => S.day.completed.includes(n.id));
    app.innerHTML = `<div class="top pad"></div><div class="stage pad"><div class="result">
      ${avatar(HOST, 'happy', 130)}
      <h1>${allDone ? 'Bugünkü dərs tamamdır!' : perfect ? 'Səhvsiz!' : esc(node.tt) + ' bitdi!'}</h1>
      ${streakUp ? `<div class="chip fire" style="font-size:20px">🔥 ${S.progress.streak} gün ardıcıl</div>` : ''}
      <div class="tiles">
        <div class="tile3"><div class="h">XP</div><b id="rxp">0</b></div>
        <div class="tile3 g"><div class="h">${perfect ? 'Mükəmməl' : 'Dəqiqlik'}</div><b>${acc}%</b></div>
        <div class="tile3 b"><div class="h">Vaxt</div><b>${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}</b></div>
      </div>
      ${S.maxCombo >= 3 ? `<p class="status">Ən uzun seriya: ${S.maxCombo} düz cavab 🔥</p>` : ''}
      ${bonus ? `<p class="status">Səhvsiz bonusu +${bonus} XP</p>` : ''}
      ${!first ? `<p class="status">Təkrar keçid: XP-nin yarısı</p>` : ''}
      ${allDone && ep && ep.next ? `<div class="hero" style="text-align:left;width:100%;margin-top:8px"><div class="eyebrow">Sabah</div><p style="margin-top:4px">${esc(ep.next)}</p></div>` : ''}
    </div></div><div class="foot pad"><button class="btn ${allDone ? 'gold' : ''}" id="home">Davam</button></div>`;
    countUp(document.getElementById('rxp'), gained, 900);
    document.getElementById('home').addEventListener('click', () => { sTap(); renderHome(); });
  }

  // ---------- boot ----------
  loadLocal();
  try { if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => { voice = null; }; } catch (e) { }
  renderHome();
  initDb();
})();
</script>
